m3devel:test:
  only:
    - /^DEV_/
  stage: test
  needs: ["m3devel:eol","m3devel:x86-64","m3devel:ramips","m3devel:lantiq","m3devel:ath79","m3devel:ipq40xx","m3devel:sunxi","m3devel:mpc85xx","m3devel:mediatek"]
  #needs: ["m3devel:x86-64","m3devel:ramips","m3devel:lantiq","m3devel:ath79","m3devel:ipq40xx","m3devel:sunxi","m3devel:mpc85xx","m3devel:mediatek"]
  artifacts:
    paths:
      # keep this as artifact, so I can compare it also when building firmware on gitlab
      # other artifacts are not needed (waste of disk storage), because they are uploaded to download server
      - ff-upload-infos/fileinfo.json.new-generated
  script:
    - ln -s ~/mycache/dl
    - ln -s ~/mycache/workdir
    - ./build.sh list
    # generate ff-upload-infos/fileinfo.json.new-generated and let store it also on error
    # "all" needed to copy all firmware to output from which
    # the json is generated
    - ./gen-upload.sh all || true
  tags:
    - m3runner

m3devel:upload:
  # do not use 'manual' job, because the build result may
  # have gone (overwritten by following builds) in /mycache/...

  #only:
  #  - /^DEV_/
  rules:
    - if: $CI_COMMIT_REF_NAME =~ "/^DEV_/"
      when: manual
    - when: never

  stage: deploy
  needs: ["m3devel:test"]
  script:
    - echo "FF_UPLOAD_DIR = [${FF_UPLOAD_DIR}]"
    - ln -s ~/mycache/dl
    - ln -s ~/mycache/workdir
    - ./gen-upload.sh all
    - |
      # gitlab-runner's public ssh key must added to /home/deploy-firmware/.ssh/authorized_keys.
      # On download server there is a user "deploy-firmware" who owns the download directories.
      if [ -n "${FF_UPLOAD_DIR}" ]; then
        rsync -av --info=all1 --delete -EH --progress final_output/*/* deploy-firmware@download.intern:/var/www/files/firmware/${FF_UPLOAD_DIR}/
      fi
      rm -rf final_output

  tags:
  - m3runner
